name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: cmake --preset vs2026-x64 -DMWFL_SOURCE_DIR=
      - name: Build
        run: cmake --build --preset vs2026-x64-release --parallel
      - name: Test
        run: ctest --preset vs2026-x64-release
      - name: Package
        run: cmake --build --preset vs2026-x64-release --target package
      - name: Stage Portable package
        shell: pwsh
        run: |
          $source = Get-ChildItem build/vs2026-x64/notepad-colon-*.zip | Select-Object -First 1
          if (-not $source) { throw "CPack did not produce a ZIP" }
          $archive = "notepad-colon-$env:GITHUB_REF_NAME-windows-x64-portable.zip"
          Copy-Item $source.FullName $archive
      - name: Upload Portable package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: notepad-colon-windows-x64
          path: notepad-colon-*-windows-x64-portable.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: packages
          merge-multiple: true
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem packages -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content packages/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem packages -File | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw "No release assets were downloaded" }
          $arguments = @("release", "create", $env:GITHUB_REF_NAME) + $assets + @("--repo", $env:GITHUB_REPOSITORY, "--verify-tag", "--generate-notes", "--title", "Notepad Colon $env:GITHUB_REF_NAME")
          if ($env:GITHUB_REF_NAME -match '-') { $arguments += "--prerelease" }
          & gh @arguments
