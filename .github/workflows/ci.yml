name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: cmake --preset vs2026-x64 -DMWFL_SOURCE_DIR=
      - name: Build
        run: cmake --build --preset vs2026-x64-debug --parallel
      - name: Test
        run: ctest --preset vs2026-x64-debug
      - name: Package portable ZIP
        run: cmake --build --preset vs2026-x64-debug --target package
      - name: Upload portable ZIP
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: notepad-colon-windows-x64
          path: build/vs2026-x64/notepad-colon-*.zip
          if-no-files-found: error
