name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: cmake --preset vs2026-x64 -DMWFL_SOURCE_DIR=
      - name: Build
        run: cmake --build --preset vs2026-x64-debug --parallel
      - name: Test
        run: ctest --preset vs2026-x64-debug
      - name: Package portable ZIP
        run: cmake --build --preset vs2026-x64-release --target package --parallel
      - name: Test Release
        run: ctest --preset vs2026-x64-release
      - name: Verify portable ZIP
        run: ./scripts/test-portable-package.ps1 -BuildDirectory build/vs2026-x64
      - name: Upload portable ZIP
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: notepad-colon-windows-x64
          path: build/vs2026-x64/notepad-colon-*.zip
          if-no-files-found: error
      - name: Install NSIS
        run: |
          choco install nsis --version=3.10 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        run: ./scripts/build-installer.ps1 -Zip (Get-Item build/vs2026-x64/notepad-colon-*.zip).FullName
      - name: Test installer
        run: ./scripts/test-installer.ps1 -Installer (Get-Item artifacts/installer/notepad-colon-*-setup.exe).FullName
      - name: Upload installer
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: notepad-colon-windows-x64-setup
          path: artifacts/installer/notepad-colon-*-setup.exe
          if-no-files-found: error

  # Cross-compiled on the x64 runner: this proves the ARM64 configuration
  # builds and packages. The binaries cannot execute here, so the test suite
  # runs only for x64 above.
  windows-arm64:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: cmake --preset vs2026-arm64 -DMWFL_SOURCE_DIR= -DBUILD_TESTING=OFF
      - name: Package portable ZIP
        run: cmake --build --preset vs2026-arm64-release --target package --parallel
      - name: Upload portable ZIP
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: notepad-colon-windows-arm64
          path: build/vs2026-arm64/notepad-colon-*.zip
          if-no-files-found: error

